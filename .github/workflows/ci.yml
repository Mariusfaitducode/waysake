# Tests, types et construction du site à chaque push et pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Version de pnpm lue dans le champ « packageManager » du package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # ffmpeg (ffmpeg-static), sharp, onnxruntime et les données GeoNames sont fournis par les paquets
      # ou le dépôt : rien à installer côté système.
      - run: pnpm install --frozen-lockfile

      # Les tests de apps/mobile/src/lib passent par son tsconfig, qui étend expo/tsconfig.base.
      - name: Dépendances de l'app mobile (pour les tests)
        working-directory: apps/mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - run: pnpm vitest run
      - run: npx tsc --noEmit -p .
      - run: pnpm build
